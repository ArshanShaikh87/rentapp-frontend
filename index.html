
<!doctype html>
<html lang="en">
  <head>
    <script>
  (function () {
    try {
      var t = localStorage.getItem("rentapp-theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.classList.toggle("dark", t === "dark");
    } catch (e) {}
  })();
</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A171D" />

    <title>RentApp — Rental Management</title>

    <meta
      name="description"
      content="Manage rental properties, tenants, rent payments, utility bills and outstanding dues with RentApp."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Poppins font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
